name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:  # the release workflow runs this before publishing

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Python tests
        run: '"$(uv python find ${{ matrix.python }})" -m unittest discover -s py/tests -v'
      - name: Round-trip tests (Node and Python CLIs)
        run: PYTHON="$(uv python find ${{ matrix.python }})" node js/test/roundtrip.js
      - name: Versions match
        run: '"$(uv python find ${{ matrix.python }})" scripts/version.py'

  generated-files:
    name: generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild web/dist/decoder.html
        run: python3 web/build.py
      - name: Fail if the committed copy is stale
        run: |
          git diff --exit-code web/dist/decoder.html || { echo "::error::web/dist/decoder.html is stale; run python3 web/build.py"; exit 1; }

  package:
    name: build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Python sdist and wheel
        run: |
          python3 py/sync_assets.py
          uv build py --out-dir dist/python
          uvx twine check dist/python/*
      - name: Build npm tarball
        run: |
          mkdir -p dist/npm
          cd js && npm pack --pack-destination ../dist/npm
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/python/
      - uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: dist/npm/

  install:
    # Installs the built packages as a normal user, the way people will: uvx and npx, no admin rights.
    name: install (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/python
      - uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: dist/npm
      - name: uvx qbeam (Python ${{ matrix.python }})
        run: |
          expected="qbeam $(uv run --no-project --python ${{ matrix.python }} python scripts/version.py)"
          wheel=$(ls dist/python/*.whl)
          got=$(uvx --python ${{ matrix.python }} --from "$wheel" qbeam --version)
          test "$got" = "$expected" || { echo "expected '$expected', got '$got'"; exit 1; }
          uvx --python ${{ matrix.python }} --from "$wheel" qbeam send README.md --out "$RUNNER_TEMP/py.html"
          uvx --python ${{ matrix.python }} --from "$wheel" qbeam receive --no-open
      - name: npx qbeam
        run: |
          tgz=$(ls dist/npm/*.tgz)
          npx --yes --package "./$tgz" -- qbeam --version
          npx --yes --package "./$tgz" -- qbeam send README.md --out "$RUNNER_TEMP/npm.html"
          npx --yes --package "./$tgz" -- qbeam receive --no-open
