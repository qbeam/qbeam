name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:  # the release workflow runs this before publishing

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Python tests
        run: '"$(uv python find ${{ matrix.python }})" -m unittest discover -s py/tests -v'
      - name: Python encryption tests (with the optional qbeam[crypto] package)
        run: uv run --no-project --python ${{ matrix.python }} --with "cryptography>=41" python -m unittest discover -s py/tests -p "test_c*.py" -v
      - name: Round-trip tests (Node and Python CLIs)
        run: PYTHON="$(uv python find ${{ matrix.python }})" node js/test/roundtrip.js
      - name: Protocol v3 tests (JS codec, Python-encoded codes)
        run: PYTHON="$(uv python find ${{ matrix.python }})" node js/test/v3.js
      - name: Terminal mode decoded by zxing
        run: PYTHON="$(uv python find ${{ matrix.python }})" node js/test/terminal_decode.js
      - name: Fuzz the receiver's parsers
        run: node js/test/fuzz.js
      - name: Versions match
        run: '"$(uv python find ${{ matrix.python }})" scripts/version.py'

  generated-files:
    name: generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Protocol test vectors still match the reference codec
        run: |
          node protocol/test-vectors/generate.js
          node protocol/test-vectors/generate_v3.js
          git diff --exit-code protocol/test-vectors/ || { echo "::error::The reference codecs (js/fountain.js, js/qbeam3.js) no longer match protocol/test-vectors/. Regenerate only for a deliberate, documented protocol change."; exit 1; }
      - name: Store listing text fits Play and App Store limits
        run: python3 scripts/check_store.py
      - name: Rebuild web/dist/decoder.html
        run: python3 web/build.py
      - name: Fail if the committed copy is stale
        run: |
          git diff --exit-code web/dist/decoder.html || { echo "::error::web/dist/decoder.html is stale; run python3 web/build.py"; exit 1; }

  swift:
    # QBeamKit, the iOS app's protocol codec, against the shared vectors.
    name: iOS (QBeamKit tests + app build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: ios/QBeamKit
        run: swift test
      - name: Build the iOS app for the Simulator
        working-directory: ios/App
        run: |
          brew install xcodegen
          xcodegen
          for trial in NO YES; do   # beta, and the store build with the trial switch on
            xcodebuild -project QBeam.xcodeproj -scheme QBeam -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build CODE_SIGNING_ALLOWED=NO QBEAM_TRIAL=$trial build
          done

  kotlin:
    # qbeam-core, the Android app's protocol codec, against the shared vectors.
    name: Android (core tests + app build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: gradle test
        working-directory: android
        run: ./gradlew :core:test --console=plain
      - name: Android SDK platform 36
        # `|| true`: yes dies of SIGPIPE when sdkmanager exits first, which fails the step under pipefail.
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build the app (foss, and play with the trial switch on)
        working-directory: android
        run: ./gradlew :app:assembleFossDebug :app:assemblePlayDebug -Pqbeam.trial=true --console=plain
      - name: The app never gains network access; foss has no Google billing (privacy page, F-Droid)
        working-directory: android
        run: |
          d=app/build/intermediates/merged_manifest
          for pair in foss:Foss play:Play; do
            f=${pair%%:*}; m=$d/${f}Debug/process${pair##*:}DebugMainManifest/AndroidManifest.xml
            echo "== $f"; grep -E 'uses-permission' "$m"
            if grep -qE 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' "$m"; then
              echo "::error::The $f manifest requests network access. A dependency added it; remove it in AndroidManifest.xml (tools:node=\"remove\") or rethink the dependency."; exit 1
            fi
          done
          if grep -q 'com.android.vending.BILLING' $d/fossDebug/processFossDebugMainManifest/AndroidManifest.xml; then
            echo "::error::The foss flavour picked up Google Play Billing; keep billing dependencies playImplementation only."; exit 1
          fi

  optics:
    # Real sender frames through a simulated phone camera, decoded by the receiver's zxing build. Fails when a
    # change makes codes harder to read (PLAN P2.13 / P2.15a).
    name: simulated camera
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node js/test/optics.js

  package:
    name: build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Python sdist and wheel
        run: |
          python3 py/sync_assets.py
          uv build py --out-dir dist/python
          uvx twine check dist/python/*
      - name: Build single-file qbeam.pyz
        run: |
          python3 py/build_pyz.py
          mkdir -p dist/pyz && cp py/dist/*.pyz dist/pyz/
      - name: Build npm tarball
        run: |
          mkdir -p dist/npm
          cd js && npm pack --pack-destination ../dist/npm
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/python/
      - uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: dist/npm/
      - uses: actions/upload-artifact@v4
        with:
          name: pyz-dist
          path: dist/pyz/

  install:
    # Installs the built packages as a normal user, the way people will: uvx and npx, no admin rights.
    name: install (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/python
      - uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: dist/npm
      - uses: actions/download-artifact@v4
        with:
          name: pyz-dist
          path: dist/pyz
      - name: python qbeam.pyz (Python ${{ matrix.python }}, nothing installed)
        run: |
          pyz=$(ls dist/pyz/*.pyz)
          py="$(uv python find ${{ matrix.python }} 2>/dev/null || (uv python install ${{ matrix.python }} >/dev/null && uv python find ${{ matrix.python }}))"
          "$py" "$pyz" --version
          "$py" "$pyz" send README.md --browser --no-open --out "$RUNNER_TEMP/pyz.html"
          grep -q QBeam3 "$RUNNER_TEMP/pyz.html"
          (cd "$RUNNER_TEMP" && "$py" "$GITHUB_WORKSPACE/$pyz" receive --no-open && test -s qbeam-receiver.html)
      - name: uvx qbeam (Python ${{ matrix.python }})
        run: |
          expected="qbeam $(uv run --no-project --python ${{ matrix.python }} python scripts/version.py)"
          wheel=$(ls dist/python/*.whl)
          got=$(uvx --python ${{ matrix.python }} --from "$wheel" qbeam --version)
          test "$got" = "$expected" || { echo "expected '$expected', got '$got'"; exit 1; }
          uvx --python ${{ matrix.python }} --from "$wheel" qbeam send README.md --browser --no-open --out "$RUNNER_TEMP/py.html"
          uvx --python ${{ matrix.python }} --from "$wheel" qbeam receive --no-open
      - name: npx qbeam
        run: |
          tgz=$(ls dist/npm/*.tgz)
          npx --yes --package "./$tgz" -- qbeam --version
          npx --yes --package "./$tgz" -- qbeam send README.md --no-open --out "$RUNNER_TEMP/npm.html"
          npx --yes --package "./$tgz" -- qbeam receive --no-open
