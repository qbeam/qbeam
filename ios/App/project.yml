# XcodeGen spec for the iOS receiver app: `cd ios/App && xcodegen` writes QBeam.xcodeproj (generated, not committed).
name: QBeam
options:
  bundleIdPrefix: dev.qbeam
  deploymentTarget:
    iOS: "17.0"
packages:
  QBeamKit:
    path: ../QBeamKit
  ZXingCpp:
    path: ../ZXingCpp   # vendored zxing-cpp v3.1.1 built with NDEBUG (see its Package.swift)
targets:
  QBeam:
    type: application
    platform: iOS
    sources: [Sources]
    # Keys Xcode's generated Info.plist ignores as INFOPLIST_KEY_* settings; merged with the generated ones.
    # UIFileSharingEnabled + LSSupportsOpeningDocumentsInPlace list Documents in Files › On My iPhone › qbeam.
    info:
      path: Info.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        QBeamTrial: $(QBEAM_TRIAL)   # the trial switch, read by ReceiverModel
    dependencies:
      - package: QBeamKit
      - package: ZXingCpp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.qbeam.app
        PRODUCT_NAME: qbeam
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        QBEAM_TRIAL: "NO"   # beta builds; a store release builds with QBEAM_TRIAL=YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # Sources/Assets.xcassets, from scripts/store_icons.py
        INFOPLIST_KEY_CFBundleDisplayName: qbeam
        INFOPLIST_KEY_NSCameraUsageDescription: "qbeam reads the codes on the sending screen with the camera. Nothing leaves this device."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
