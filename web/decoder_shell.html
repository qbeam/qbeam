<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>qbeam receiver</title>
<style>
  html, body { margin: 0; padding: 0; background: #111; color: #eee; font-family: -apple-system, system-ui, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 8px 0 4px; }
  .hint { color: #aaa; font-size: 13px; margin-bottom: 12px; }
  video { width: 100%; max-height: 50vh; object-fit: contain; border-radius: 8px; background: #000; display: block; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
  button, select, input { padding: 10px 14px; font-size: 16px; border-radius: 6px; border: 1px solid #555; background: #222; color: #eee; }
  #cameraWrap { display: none; gap: 6px; align-items: center; }
  #status { margin-top: 12px; font-size: 15px; min-height: 40px; }
  #hint { display: none; margin-top: 8px; padding: 10px; background: #3d3210; border: 1px solid #a8862a; border-radius: 6px; color: #ffe08a; font-size: 13px; }
  #error { display: none; margin-top: 8px; padding: 10px; background: #4a1414; border: 1px solid #b33; border-radius: 6px; color: #ffb3b3; font-size: 13px; }
  #progressWrap { margin-top: 10px; height: 22px; background: #333; border-radius: 6px; overflow: hidden; }
  #progressBar { height: 100%; width: 0; background: #2e7d32; color: #fff; font-size: 12px; line-height: 22px; text-align: center; white-space: nowrap; }
  #passWrap { display: none; margin-top: 12px; }
  #passInput { width: 60%; }
  #stats { margin-top: 10px; color: #777; font-size: 11px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <h1>qbeam receiver</h1>
  <div class="hint">Point the camera at the codes on the sending screen. Works offline once this page is open; nothing is uploaded.</div>
  <div class="row">
    <button id="startBtn">Start camera</button>
    <label id="cameraWrap">camera <select id="cameraSel"></select></label>
    <button id="resetBtn">Reset</button>
  </div>
  <video id="video" playsinline muted autoplay></video>
  <div id="status"></div>
  <div id="progressWrap"><div id="progressBar"></div></div>
  <div id="passWrap"><input id="passInput" type="password" autocomplete="off" placeholder="passphrase"> <button id="passBtn">Decrypt</button></div>
  <div id="hint"></div>
  <div id="error"></div>
  <div id="stats"></div>
</div>
<script type="text/plain" id="zxing-src">/*__ZXING__*/</script>
<script type="text/plain" id="worker-src">/*__WORKER__*/</script>
<script type="application/octet-stream" id="zxing-wasm">__ZXING_WASM_B64__</script>
<script>/*__QBEAM3__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
