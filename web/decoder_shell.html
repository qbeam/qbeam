<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR File Receiver</title>
<style>
  html, body { margin: 0; padding: 0; background: #111; color: #eee; font-family: -apple-system, system-ui, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 8px 0 4px; }
  .hint { color: #aaa; font-size: 13px; margin-bottom: 12px; }
  video { width: 100%; border-radius: 8px; background: #000; display: block; }
  #status { margin-top: 12px; font-size: 15px; min-height: 40px; }
  #error { display: none; margin-top: 8px; padding: 10px; background: #4a1414; border: 1px solid #b33; border-radius: 6px; color: #ffb3b3; font-size: 13px; }
  #progressWrap { display: none; margin-top: 10px; height: 22px; background: #333; border-radius: 6px; overflow: hidden; }
  #progressBar { height: 100%; width: 0%; background: #2e7d32; color: #fff; font-size: 12px; line-height: 22px; text-align: center; transition: width 0.15s; white-space: nowrap; }
  button { margin-top: 14px; padding: 10px 16px; font-size: 14px; border-radius: 6px; border: 1px solid #555; background: #222; color: #eee; }
</style>
</head>
<body>
<div class="wrap">
  <h1>QR File Receiver</h1>
  <div class="hint">Point the camera at the animated QR code being shown on the sending device. No internet or network needed — this page works entirely offline once opened.</div>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas" style="display:none;"></canvas>
  <div id="status">Starting camera…</div>
  <div id="progressWrap"><div id="progressBar"></div></div>
  <div id="error"></div>
  <button id="resetBtn">Reset</button>
</div>
<script>/*__JSQR__*/</script>
<script>/*__FOUNTAIN__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
