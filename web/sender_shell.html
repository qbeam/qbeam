<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Sender — __TITLE__</title>
<style>
  html, body { margin: 0; padding: 0; background: #111; color: #eee; font-family: -apple-system, system-ui, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; box-sizing: border-box; text-align: center; }
  h1 { font-size: 16px; margin: 8px 0 2px; word-break: break-all; }
  .hint { color: #aaa; font-size: 12px; margin-bottom: 12px; }
  #stage { background: #fff; border-radius: 8px; padding: 16px; display: inline-block; }
  #stage:fullscreen { display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 0; }
  #qrContainer svg { width: min(90vw, 480px); height: min(90vw, 480px); display: block; }
  #indexLabel { margin-top: 10px; font-size: 14px; color: #ccc; }
  .controls { margin-top: 16px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; }
  button { padding: 10px 16px; font-size: 14px; border-radius: 6px; border: 1px solid #555; background: #222; color: #eee; }
  #intervalLabel { font-size: 12px; color: #aaa; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="filenameLabel">__TITLE__</h1>
  <div class="hint">Open <b>decoder.html</b> on the receiving device, point its camera here, and leave this running. It runs forever (missed frames are recovered from later ones, no need to wait for a full loop) — stop it once the receiver shows "Done".</div>
  <div id="stage">
    <div id="qrContainer"></div>
  </div>
  <div id="indexLabel"></div>
  <div class="controls">
    <button id="playPauseBtn">Pause</button>
    <button id="fullscreenBtn">Fullscreen</button>
    <div>
      <input type="range" id="intervalSlider" min="100" max="1000" step="50" value="350">
      <div id="intervalLabel"></div>
    </div>
  </div>
</div>

</html>
